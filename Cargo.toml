[workspace]
resolver = "3"
members = [
    "crates/inception",
    "crates/inception-derive",
    "crates/inception-wasm",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.clippy]
pedantic = "warn"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
